name: Security checks
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
  clients-cache:
    if: github.event_name != 'schedule'
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Production homepage cache and failure recovery
        run: npm run test:clients:cache
      - name: Production bilingual editorial preview and cache isolation
        run: node scripts/editorial-preview.mjs
